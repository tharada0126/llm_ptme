services:
  llm-exp:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-energy-exp:latest
    working_dir: /workspace
    privileged: true

    volumes:
      - .:/workspace
      - ./results:/workspace/results
      - ollama_models:/root/.ollama
      - /sys/class/powercap:/sys/class/powercap:ro

    environment:
      SCENARIO: "${SCENARIO:-full}"
      OLLAMA_NUM_THREADS: "${OLLAMA_NUM_THREADS:-10}"
      MMLU_PRO_DIR: "/opt/MMLU-Pro"
      GSM8K_DIR: "/opt/grade-school-math"
      HUMAN_EVAL_DIR: "/opt/human-eval"
      OLLAMA_HOST: "127.0.0.1:11434"
      MAX_SAMPLES: "${MAX_SAMPLES:-none}"
      SELECTED_IDS_FILE: "${SELECTED_IDS_FILE:-none}"
      GSM8K_SELECTED_IDX_FILE: "${GSM8K_SELECTED_IDX_FILE:-none}"

    command: |
      bash -lc '
        ollama serve > /tmp/ollama.log 2>&1 &
        sleep 5
        python main.py --scenario ${SCENARIO:-E0} --model_name ${MODEL_NAME:-tinyllama:1.1b} --dataset_name ${DATASET_NAME:-human_eval} --max_samples ${MAX_SAMPLES:-none} --selected_ids_file ${SELECTED_IDS_FILE:-none} --gsm8k_selected_idx_file ${GSM8K_SELECTED_IDX_FILE:-none}
      '

volumes:
  ollama_models: